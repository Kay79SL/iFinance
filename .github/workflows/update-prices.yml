name: Update daily prices

on:
  # Run every weekday at 22:00 UTC (about 30 min after US market close 17:30 UTC winter / 21:00 UTC summer)
  schedule:
    - cron: '0 22 * * 1-5'
  # Also let you run it manually from the Actions tab
  workflow_dispatch:

# Cancel superseded runs
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit updated prices.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "prices.json unchanged, nothing to commit."
          else
            git commit -m "chore: update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi